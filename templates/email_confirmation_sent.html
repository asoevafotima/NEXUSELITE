<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигнал отправлен | Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg: #cdc8bf; --surface: #d6d1c8; --surface2: #c4beb3;
            --text: #1a1a1a; --text2: #525252; --accent: #2563eb;
            --border: rgba(0, 0, 0, 0.08); --radius: 16px;
        }
        [data-theme="dark"] {
            --bg: #161618; --surface: #1e1e21; --surface2: #28282c;
            --text: #f0f0f0; --text2: #9494a1; --accent: #4f8aff;
            --border: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; min-height: 100vh; transition: 0.4s; }

        nav { padding: 0 5%; height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg); }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent); }

        .btn-ui { font-size: 0.7rem; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; color: var(--text); }

        .main-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--surface); padding: 50px 40px; border-radius: var(--radius); border: 1px solid var(--border); max-width: 450px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.03); text-align: center; }

        .icon-box { font-size: 3rem; margin-bottom: 20px; color: var(--accent); }
        .auth-card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 12px; }
        .status-msg { display: block; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 25px; font-weight: 700; }

        .p-main { font-size: 0.9rem; color: var(--text2); line-height: 1.6; margin-bottom: 30px; }

        .back-btn { display: inline-block; width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: 800; text-decoration: none; transition: 0.2s; }
        .back-btn:hover { background: var(--accent); color: white; transform: translateY(-2px); }

        footer { padding: 30px 5%; border-top: 1px solid var(--border); margin-top: auto; }
        .f-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text2); }
        
        .reveal { opacity: 0; transform: translateY(10px); }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo"><span>ELITE</span></a>
    <div style="display: flex; gap: 8px;">
        <button class="btn-ui" onclick="toggleLang()" id="lang-btn">RU</button>
        <button class="btn-ui" id="theme-toggle">🌙</button>
    </div>
</nav>

<div class="main-wrapper">
    <div class="auth-card reveal">
        <div class="icon-box">✉</div>
        <h2 data-i18n="h_sent">Сигнал отправлен</h2>
        <span class="status-msg" data-i18n="status">transmission protocol</span>

        <p class="p-main" data-i18n="p_msg">
            Проверьте вашу почту. Мы отправили защищенную ссылку для подтверждения вашего аккаунта. 
            Если письма нет, проверьте папку «Спам».
        </p>

        <a href="{% url 'login' %}" class="back-btn" data-i18n="btn_back">Вернуться ко входу</a>
    </div>
</div>

<footer>
    <div class="f-bottom">
        <p>© 2026  ELITE</p>
        <div style="font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent);" id="footer-clock">00:00:00</div>
    </div>
</footer>

<script>
    const T = {
        en: { 
            h_sent: "Signal Sent", status: "transmission protocol", btn_back: "Back to Login",
            p_msg: "Check your email. We've sent a secure link to verify your account. If you don't see it, check your spam folder."
        },
        ru: { 
            h_sent: "Сигнал отправлен", status: "протокол передачи", btn_back: "Вернуться ко входу",
            p_msg: "Проверьте вашу почту. Мы отправили защищенную ссылку для подтверждения вашего аккаунта. Если письма нет, проверьте папку «Спам»."
        }
    };
    
    let currentLang = 'ru';
    function toggleLang() {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        document.getElementById('lang-btn').textContent = currentLang === 'en' ? 'RU' : 'EN';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const k = el.getAttribute('data-i18n');
            if (T[currentLang][k]) el.textContent = T[currentLang][k];
        });
    }

    document.getElementById('theme-toggle').addEventListener('click', function() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        this.textContent = isDark ? '🌙' : '☀️';
    });

    setInterval(() => { 
        document.getElementById('footer-clock').textContent = new Date().toLocaleTimeString(); 
    }, 1000);

    window.onload = () => { 
        gsap.to('.reveal', { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }); 
    };
</script>

</body>
</html>
