<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обновление доступа |  Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg: #cdc8bf; 
            --surface: #d6d1c8; 
            --surface2: #c4beb3;
            --text: #1a1a1a;
            --text2: #525252;
            --accent: #2563eb;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 20px 50px rgba(0,0,0,0.05);
            --radius: 24px;
        }

        [data-theme="dark"] {
            --bg: #1a1a1c; 
            --surface: #222226;
            --surface2: #2d2d33;
            --text: #f0f0f0;
            --text2: #9494a1;
            --accent: #4f8aff;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Manrope', sans-serif; 
            display: flex; flex-direction: column; min-height: 100vh;
            transition: 0.4s ease;
        }

        /* --- NAV --- */
        nav {
            position: sticky; top: 0; z-index: 1000;
            background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; height: 75px; backdrop-filter: blur(10px);
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--text); text-decoration: none; letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        .btn-ui {
            font-size: 0.75rem; font-weight: 800; padding: 10px 22px; border-radius: 50px;
            border: 1px solid var(--border); background: var(--surface2);
            cursor: pointer; text-decoration: none; color: var(--text); transition: 0.3s;
        }
        .btn-ui:hover { background: var(--text); color: var(--bg); }

        /* --- AUTH CARD --- */
        .main-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        
        .auth-card {
            background: var(--surface);
            padding: 50px 40px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow);
        }

        .auth-card h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1;
        }

        /* Django Form Elements */
        form p { margin-bottom: 20px; display: flex; flex-direction: column; }
        
        label { 
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase; 
            margin-bottom: 8px; color: var(--text2); letter-spacing: 1px;
        }

        input {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); background: var(--bg); }

        .helptext { 
            font-size: 0.75rem; color: var(--text2); margin-top: 8px; 
            line-height: 1.4; opacity: 0.8; 
        }

        .submit-btn {
            width: 100%; padding: 20px; background: #1a1a1a;
            color: white; border: none; border-radius: 50px;
            font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem;
            letter-spacing: 1px; cursor: pointer; transition: 0.3s;
            margin-top: 15px;
        }
        .submit-btn:hover { background: var(--accent); transform: translateY(-3px); }

        .back-link {
            display: block; text-align: center; margin-top: 25px;
            color: var(--text2); text-decoration: none; font-size: 0.8rem;
            font-weight: 700; text-transform: uppercase; transition: 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        /* --- FOOTER --- */
        footer { background: var(--surface); border-top: 1px solid var(--border); padding: 60px 5% 30px; margin-top: auto; }
        .f-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text2); }
        
        .reveal { opacity: 0; transform: translateY(20px); }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'home' %}" class="logo">NEXUS<span>ELITE</span></a>
    <div style="display: flex; gap: 12px;">
        <button class="btn-ui" onclick="toggleLang()" id="lang-btn">RU</button>
        <button class="btn-ui" id="theme-toggle">🌙</button>
    </div>
</nav>

<div class="main-wrapper">
    <div class="auth-card reveal">
        <h2 data-i18n="h_title">ОБНОВИТЬ ДОСТУП</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit-btn" data-i18n="btn_submit">СБРОСИТЬ ПАРОЛЬ</button>
        </form>

        <a href="{% url 'login' %}" class="back-link" data-i18n="btn_back">← ВЕРНУТЬСЯ К ВХОДУ</a>
    </div>
</div>

<footer>
    <div class="f-bottom">
        <p>© 2026  ELITE. Безопасность и контроль доступа.</p>
        <div style="font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent);" id="footer-clock">00:00:00</div>
    </div>
</footer>

<script>
    const T = {
        en: { 
            h_title: "UPDATE ACCESS", btn_submit: "RESET PASSWORD", 
            btn_back: "← BACK TO LOGIN"
        },
        ru: { 
            h_title: "ОБНОВИТЬ ДОСТУП", btn_submit: "СБРОСИТЬ ПАРОЛЬ", 
            btn_back: "← ВЕРНУТЬСЯ К ВХОДУ"
        }
    };
    
    let currentLang = 'ru';
    function toggleLang() {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        document.getElementById('lang-btn').textContent = currentLang === 'en' ? 'RU' : 'EN';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const k = el.getAttribute('data-i18n');
            if (T[currentLang][k]) el.textContent = T[currentLang][k];
        });
    }

    document.getElementById('theme-toggle').addEventListener('click', function() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        this.textContent = isDark ? '☀️' : '🌙';
    });

    setInterval(() => { document.getElementById('footer-clock').textContent = new Date().toLocaleTimeString(); }, 1000);
    window.onload = () => { gsap.to('.reveal', { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }); };
</script>

</body>
</html>
