<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminate Protocol | Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg: #030305;
            --accent: #00f2fe;
            --neon-pink: #ff007a;
            --neon-purple: #7000ff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --orb-opacity: 0.6;
        }

        [data-theme="light"] {
            --bg: #f0f2f5;
            --accent: #007aff;
            --neon-pink: #ff2d55;
            --neon-purple: #5856d6;
            --glass: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text: #1d1d1f;
            --orb-opacity: 0.2;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* ЖИВОЙ ФОН */
        .orb-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(80px);
            opacity: var(--orb-opacity);
            pointer-events: none;
        }

        /* КНОПКА ТЕМЫ */
        .theme-toggle {
            position: fixed;
            top: 30px; right: 30px;
            cursor: pointer;
            width: 50px; height: 50px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: 0.3s;
        }
        .theme-toggle:hover { transform: scale(1.1) rotate(15deg); border-color: var(--neon-pink); }

        .delete-card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 0, 122, 0.2);
            border-radius: 40px;
            padding: 60px 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(255, 0, 122, 0.1);
            position: relative;
        }

        .warning-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 0 15px var(--neon-pink));
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 15px;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-delete {
            padding: 18px 35px;
            background: var(--neon-pink);
            border: none;
            color: #fff;
            border-radius: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(255, 0, 122, 0.3);
        }

        .btn-delete:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 45px rgba(255, 0, 122, 0.5);
            background: #ff2d8d;
        }

        .btn-cancel {
            padding: 18px 35px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            border-radius: 20px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
        }

        .btn-cancel:hover {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        @keyframes float { 
            from { transform: translate(-10%, -10%) rotate(0deg); } 
            to { transform: translate(15%, 15%) rotate(360deg); } 
        }
    </style>
</head>
<body>

<div class="orb-canvas" id="canvas"></div>
<div class="theme-toggle" id="theme-btn">🌙</div>

<div class="delete-card" id="card">
    <span class="warning-icon">⚠️</span>
    <h2 class="reveal">Terminate Object</h2>
    <p class="reveal">You are about to permanently remove this asset from the Nexus core. This operation cannot be undone. Are you sure?</p>

    <form method="post" class="btn-group reveal">
        {% csrf_token %}
        <button type="submit" class="btn-delete">Confirm Delete</button>
        <a href="{% url 'home' %}" class="btn-cancel">Abort</a>
    </form>
</div>

<script>
    // THEME ENGINE
    const themeBtn = document.getElementById('theme-btn');
    themeBtn.addEventListener('click', () => {
        if (document.body.getAttribute('data-theme') === 'light') {
            document.body.removeAttribute('data-theme');
            themeBtn.innerHTML = '🌙';
        } else {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.innerHTML = '☀️';
        }
    });

    // BACKGROUND ORBS
    const canvas = document.getElementById('canvas');
    const colors = ['var(--neon-pink)', 'var(--neon-purple)', '#330022'];
    for(let i=0; i<3; i++) {
        const orb = document.createElement('div');
        orb.style.cssText = `
            position:absolute; 
            width:${500+i*150}px; height:${500+i*150}px; 
            background:${colors[i]}; 
            border-radius:50%; 
            top:${20+i*10}%; left:${10+i*20}%; 
            animation:float ${12+i*4}s infinite alternate ease-in-out;
        `;
        canvas.appendChild(orb);
    }

    
    gsap.from("#card", { duration: 1, opacity: 0, scale: 0.9, ease: "power4.out" });
    gsap.from(".reveal", { 
        duration: 0.8, 
        opacity: 0, 
        y: 20, 
        stagger: 0.1, 
        delay: 0.3, 
        ease: "power3.out" 
    });
</script>

</body>
</html>
